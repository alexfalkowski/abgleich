version: "1.0"
name: abgleich
url: http://localhost:11000
log: reports/nonnative.log
servers:
  - name: github
    class: Abgleich::GitHubServer
    timeout: 5
    host: 127.0.0.1
    ports: [11001]
    log: reports/github.log
processes:
  - name: server
    go:
      output: reports
      executable: ../abgleich
      command: server
      parameters: ["-config file:.config/server.yaml"]
    timeout: 5
    host: 127.0.0.1
    ports:
      - 11000
    log: reports/server.log
    readiness:
      - kind: http
        port: 11000
        path: /abgleich/readyz
