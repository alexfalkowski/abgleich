environment: development
github:
  client:
    endpoint: http://localhost:11001/github/
    timeout: 1m
    retry:
      attempts: 2
      backoff: 10ms
  owner: alexfalkowski
  app:
    id: 42
    installation_id: 99
    private_key: file:secrets/github-app-private-key.pem
  webhook:
    secret: file:secrets/github-webhook-secret
    timeout: 2s
scheduler:
  interval: 1s
  timeout: 2s
health:
  duration: 50ms
  timeout: 1s
id:
  kind: uuid
telemetry:
  logger:
    kind: json
    level: debug
  metrics:
    kind: prometheus
  tracer:
    kind: otlp
    endpoint: http://localhost:4318/v1/traces
transport:
  http:
    address: tcp://:11000
    timeout: 5s
    max_receive_size: 1048576B
ai:
  providers:
    openai:
      kind: openai
      api_key: file:secrets/openai-api-key
      client:
        endpoint: http://localhost:11001/openai/v1/
review:
  # Large directory fixtures need time for source reads and repeated provider requests.
  code:
    provider: openai
    model: test-review
    effort: high
    interval: 100ms
    timeout: 20s
  sec:
    provider: openai
    model: test-security
    effort: high
    interval: 100ms
    timeout: 20s
  go_docs:
    endpoint: http://localhost:11001/modules/docs
  module_proxy:
    endpoint: http://localhost:11001/modules
    retry:
      attempts: 2
      backoff: 10ms
  gem_registry:
    endpoint: http://localhost:11001/rubygems
