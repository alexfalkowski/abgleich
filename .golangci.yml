version: "2"
linters:
  default: all
  disable:
    - bodyclose
    - embeddedstructfieldcheck
    - exhaustruct
    - exhaustruct_v5
    - depguard
    - funcorder
    - gochecknoglobals
    - goconst
    - gomodguard
    - gomodguard_v2
    - interfacebloat
    - ireturn
    - nilnil
    - nlreturn
    - noinlineerr
    - paralleltest
    - tagalign
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    lll:
      line-length: 160
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
          toml: snake
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - .*\.pb*
    rules:
      # GitHub GraphQL payloads must match the external API's field names.
      - path: internal/github/github\.go
        text: 'json\(snake\)'
        linters:
          - tagliatelle
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - .*\.pb*
