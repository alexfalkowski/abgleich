version: 2.1

commands:
  sync-submodules:
    steps:
      - run: git submodule sync
      - run: git submodule update --init
  checkout-submodules:
    steps:
      - checkout:
          method: blobless
      - sync-submodules
  prepare-service:
    steps:
      - checkout-submodules
      - run: make source-key
      - restore_cache:
          name: restore go cache
          keys:
            - abgleich-go-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-version" }}
            - abgleich-go-cache-
      - restore_cache:
          name: restore ruby cache
          keys:
            - abgleich-ruby-cache-{{ checksum "test/Gemfile.lock" }}-{{ checksum "~/.ruby-version" }}
            - abgleich-ruby-cache-
      - run: make clean
      - run: make dep
      - restore_cache:
          name: restore go build cache
          keys:
            - abgleich-go-build-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-version" }}-{{ checksum ".source-key" }}
            - abgleich-go-build-cache-

executors:
  go:
    docker:
      - image: alexfalkowski/go:5.19
  release:
    docker:
      - image: alexfalkowski/release:8.45
  alpine:
    docker:
      - image: alpine:latest

jobs:
  build-service:
    executor: go
    working_directory: ~/abgleich
    steps:
      - prepare-service
      - save_cache:
          name: save go cache
          key: abgleich-go-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-version" }}
          paths:
            - ~/go/pkg/mod
      - save_cache:
          name: save ruby cache
          key: abgleich-ruby-cache-{{ checksum "test/Gemfile.lock" }}-{{ checksum "~/.ruby-version" }}
          paths:
            - test/vendor
      - restore_cache:
          name: restore go lint cache
          keys:
            - abgleich-go-lint-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-lint-version" }}-{{ checksum ".source-key" }}
            - abgleich-go-lint-cache-
      - run: make clean
      - run: make lint
      - save_cache:
          name: save go lint cache
          key: abgleich-go-lint-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-lint-version" }}-{{ checksum ".source-key" }}
          paths:
            - ~/.cache/golangci-lint
      - run: make sec
      - run: make build-test
      - run: make analyse
      - save_cache:
          name: save go build cache
          key: abgleich-go-build-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-version" }}-{{ checksum ".source-key" }}
          paths:
            - ~/.cache/go-build
    resource_class: arm.large
  features-dependabot:
    executor: go
    working_directory: ~/abgleich
    steps:
      - prepare-service
      - run: make features-dependabot
      - store_test_results:
          path: test/reports
      - store_artifacts:
          path: test/reports
      - run: make coverage-workspace-stage partition=dependabot
      - persist_to_workspace:
          root: /tmp/abgleich-reports
          paths:
            - dependabot
    resource_class: arm.large
  features-labels:
    executor: go
    working_directory: ~/abgleich
    steps:
      - prepare-service
      - run: make features-labels
      - store_test_results:
          path: test/reports
      - store_artifacts:
          path: test/reports
      - run: make coverage-workspace-stage partition=labels
      - persist_to_workspace:
          root: /tmp/abgleich-reports
          paths:
            - labels
    resource_class: arm.large
  features-commands:
    executor: go
    working_directory: ~/abgleich
    steps:
      - prepare-service
      - run: make features-commands
      - store_test_results:
          path: test/reports
      - store_artifacts:
          path: test/reports
      - run: make coverage-workspace-stage partition=commands
      - persist_to_workspace:
          root: /tmp/abgleich-reports
          paths:
            - commands
    resource_class: arm.large
  features-summaries:
    executor: go
    working_directory: ~/abgleich
    steps:
      - prepare-service
      - run: make features-summaries
      - store_test_results:
          path: test/reports
      - store_artifacts:
          path: test/reports
      - run: make coverage-workspace-stage partition=summaries
      - persist_to_workspace:
          root: /tmp/abgleich-reports
          paths:
            - summaries
    resource_class: arm.large
  features-reconciliation:
    executor: go
    working_directory: ~/abgleich
    steps:
      - prepare-service
      - run: make features-reconciliation
      - store_test_results:
          path: test/reports
      - store_artifacts:
          path: test/reports
      - run: make coverage-workspace-stage partition=reconciliation
      - persist_to_workspace:
          root: /tmp/abgleich-reports
          paths:
            - reconciliation
    resource_class: arm.large
  features-worker:
    executor: go
    working_directory: ~/abgleich
    steps:
      - prepare-service
      - run: make features-worker
      - store_test_results:
          path: test/reports
      - store_artifacts:
          path: test/reports
      - run: make coverage-workspace-stage partition=worker
      - persist_to_workspace:
          root: /tmp/abgleich-reports
          paths:
            - worker
    resource_class: arm.large
  coverage:
    executor: go
    working_directory: ~/abgleich
    steps:
      - checkout-submodules
      - attach_workspace:
          at: /tmp/abgleich-reports
      - run: make coverage-workspace-restore
      - run: make coverage
      - store_test_results:
          path: test/reports
      - store_artifacts:
          path: test/reports
      - run: make codecov-upload
    resource_class: arm.large
  sync:
    executor: release
    working_directory: ~/abgleich
    steps:
      - checkout-submodules
      - run: make sync push
    resource_class: arm.large
  version:
    executor: release
    working_directory: ~/abgleich
    steps:
      - checkout-submodules
      - run: version
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - .
    resource_class: arm.large
  package:
    executor: release
    working_directory: ~/abgleich
    steps:
      - checkout-submodules
      - attach_workspace:
          at: /tmp/workspace
      - run: make source-key
      - restore_cache:
          name: restore go cache
          keys:
            - abgleich-go-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-version" }}
            - abgleich-go-cache-
      - restore_cache:
          name: restore go build cache
          keys:
            - abgleich-go-build-cache-{{ checksum "go.sum" }}-{{ checksum "~/.go-version" }}-{{ checksum ".source-key" }}
            - abgleich-go-build-cache-
      - run: package
    resource_class: arm.large
  wait-all:
    executor: alpine
    resource_class: small
    steps:
      - run: echo "all applicable jobs finished"
  test-docker-amd64:
    executor: go
    working_directory: ~/abgleich
    steps:
      - checkout-submodules
      - setup_remote_docker:
          docker_layer_caching: true
      - run: make platform=amd64 test-docker
    resource_class: large
  test-docker-arm64:
    executor: go
    working_directory: ~/abgleich
    steps:
      - checkout-submodules
      - setup_remote_docker:
          docker_layer_caching: true
      - run: make platform=arm64 test-docker
    resource_class: arm.large
  release-docker-amd64:
    executor: go
    working_directory: ~/abgleich
    steps:
      - checkout-submodules
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: make login
          command: echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run: make platform=amd64 release-docker
    resource_class: large
  release-docker-arm64:
    executor: go
    working_directory: ~/abgleich
    steps:
      - checkout-submodules
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: make login
          command: echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run: make platform=arm64 release-docker
    resource_class: arm.large
  manifest-docker:
    executor: go
    working_directory: ~/abgleich
    steps:
      - checkout-submodules
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: make login
          command: echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run: make manifest-docker
    resource_class: arm.large
  deploy:
    executor: release
    working_directory: ~/abgleich
    steps:
      - checkout-submodules
      - attach_workspace:
          at: /tmp/workspace
      - run: deploy
    resource_class: arm.large

workflows:
  abgleich:
    jobs:
      - build-service
      - features-dependabot:
          requires:
            - build-service
      - features-labels:
          requires:
            - build-service
      - features-commands:
          requires:
            - build-service
      - features-summaries:
          requires:
            - build-service
      - features-reconciliation:
          requires:
            - build-service
      - features-worker:
          requires:
            - build-service
      - coverage:
          requires:
            - features-dependabot
            - features-labels
            - features-commands
            - features-summaries
            - features-reconciliation
            - features-worker
      - test-docker-amd64:
          filters:
            branches:
              ignore: master
      - test-docker-arm64:
          filters:
            branches:
              ignore: master
      - sync:
          requires:
            - coverage
            - test-docker-amd64
            - test-docker-arm64
          filters:
            branches:
              ignore: master
      - version:
          context: gh
          serial-group: << pipeline.project.slug >>/version
          requires:
            - coverage
          filters:
            branches:
              only: master
      - package:
          context: gh
          serial-group: << pipeline.project.slug >>/package
          requires:
            - version
          filters:
            branches:
              only: master
      - release-docker-amd64:
          context: docker
          requires:
            - version
          filters:
            branches:
              only: master
      - release-docker-arm64:
          context: docker
          requires:
            - version
          filters:
            branches:
              only: master
      - manifest-docker:
          context: docker
          serial-group: << pipeline.project.slug >>/manifest-docker
          requires:
            - release-docker-amd64
            - release-docker-arm64
          filters:
            branches:
              only: master
      - deploy:
          context: gh
          requires:
            - package
            - manifest-docker
          filters:
            branches:
              only: master
      - wait-all:
          requires:
            - coverage
            - features-dependabot
            - features-labels
            - features-commands
            - features-summaries
            - features-reconciliation
            - features-worker
            - sync
            - test-docker-amd64
            - test-docker-arm64
            - version
            - package
            - release-docker-amd64
            - release-docker-arm64
            - manifest-docker
            - deploy
